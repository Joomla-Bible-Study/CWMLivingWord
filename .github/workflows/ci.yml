name: CI

# The lint, test and build steps live in cwm-build-tools so every CWM
# extension runs the same pipeline and a fix lands everywhere at once. What
# stays here is when CI runs, and the values that differ from the shared
# defaults.
#
# The reusable workflow is .github/workflows/joomla-package-ci.yml in
# Joomla-Bible-Study/cwm-build-tools. To see what the inputs do, or to change
# a step, edit it there.
#
# Removed in the migration, and worth recording so it is not re-added by
# reflex: a MySQL 8.4 service container, a full shallow clone of joomla-cms
# 5.4.3, a schema import, `mkdir -p tests/integration`, and the JTEST_DB_* /
# JOOMLA_CMS_PATH environment. All of it existed for integration tests that
# do not exist — tests/integration is empty, and nothing in the repository
# reads any of those variables. The mkdir was there so PHPUnit would not
# error on the missing directory. If integration tests are written later,
# that scaffolding needs to come back deliberately, in a job of its own,
# rather than as dead weight on every run.

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'admin/language/**'
      - 'site/language/**'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠️ build/fetch_dependencies.php asks api.github.com for the latest
  # CWMScriptureLinks release. Unauthenticated, that shares a rate limit with
  # every other job on the runner's IP address, and a build fails with HTTP 403
  # for reasons that have nothing to do with this repository -- which is how it
  # failed on the v1.28 dependency bump.
  #
  # The script already sends `Authorization: Bearer` when GITHUB_TOKEN or
  # GH_TOKEN is set; it was simply never given one. The automatic token lifts
  # the limit from 60 requests an hour to 1000.
  #
  # Set at workflow level rather than on the one step that builds today: the
  # fetch runs from the preBuild hook, so any future build step needs it too,
  # and a step added without it would fail the same way.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: PHP Lint & Tests
    # `v1` is a moving tag on cwm-build-tools, re-pointed at each release —
    # the CI equivalent of the `^1.4` Composer constraint in composer.json.
    uses: Joomla-Bible-Study/cwm-build-tools/.github/workflows/joomla-package-ci.yml@v1
    with:
      php-version: '8.3'
      # PHP CS Fixer was held off during the migration because the tree had
      # formatting it would reject. That debt is paid — `composer lint` reports
      # 0 of 97 files fixable — so it gates now, in its own change, which is
      # how the migration comment said to turn it on.
      run-lint: true
      run-lint-syntax: true
      # Added in cwm-build-tools v1.16.0, and reachable because the same release
      # restored the moving v1 tag. Runs as its own parallel `JS Lint` check,
      # so it costs the PHP job nothing.
      run-lint-js: true
      # Executes the migration files themselves. Everything else here proves the
      # destination schema is right: a fresh install applies install.sql and
      # Joomla stamps #__schemas at the newest version without running a single
      # update file, so until this the update SQL only ever ran on a user's site
      # mid-upgrade. Runs as its own job with its own MySQL service.
      run-schema-replay: true
      build-command: 'composer build'
      package-glob: 'build/dist/pkg_livingword-*.zip'