name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, xml, zip, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches livingword.xml
        run: |
          XML_VERSION=$(php -r '$x = simplexml_load_file("livingword.xml"); echo (string) $x->version;')
          if [ "$XML_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version (${{ steps.version.outputs.version }}) does not match livingword.xml (<version>$XML_VERSION</version>)"
            exit 1
          fi

      - name: Build package
        run: composer build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record bundled scripture version
        id: scripture
        run: |
          SCRIPTURE_VERSION=$(gh release view --repo Joomla-Bible-Study/CWMScriptureLinks --json tagName -q '.tagName' | sed 's/^v//')
          echo "version=$SCRIPTURE_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only when nothing published this tag already.
      #
      # `composer release` (cwm-release) builds, creates the GitHub release,
      # uploads the zip and publishes to ARS — all before the tag it pushes
      # reaches this workflow. So this step lost the race on every release
      # since v5.6.0-beta1 and failed the run with "a release with the same tag
      # name already exists", six red runs deep by 5.7.0-beta3.
      #
      # The build above is still worth running: it proves the package builds on
      # a clean machine rather than only on the maintainer's, and the step
      # before it proves the tag matches the manifest. What is no longer this
      # workflow's job is publishing, unless a tag arrives without the release
      # pipeline having run — a hand-pushed tag, which is the case this branch
      # still covers.
      #
      # It never overwrites: an existing release's asset is the one that was
      # tested and published to ARS, and a runner rebuild is not byte-identical
      # to it.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SCRIPTURE="${{ steps.scripture.outputs.version }}"
          PKG="build/dist/pkg_livingword-$VERSION.zip"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG is already published — leaving it untouched."
            echo "$TAG already published; this run verified the build only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh release create "$TAG" "$PKG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LivingWord $TAG" \
            --notes "$(cat <<EOF
          ## Install

          Download \`pkg_livingword-$VERSION.zip\` and install via Joomla's Extension Manager.

          ## Bundled

          - \`com_livingword\` $VERSION — LivingWord component (admin + site + media)
          - \`mod_livingword\` — Daily reading module
          - \`plg_task_livingword\` — Scheduled email delivery task plugin
          - \`pkg_cwmscripture\` v$SCRIPTURE — Bible provider library, scripture linking
            and scripture task plugins. Installed only if your site has an older
            version; uninstalling LivingWord leaves it in place.

          ## Requirements

          - PHP 8.3+
          - Joomla 5.x / 6.x
          EOF
          )"
